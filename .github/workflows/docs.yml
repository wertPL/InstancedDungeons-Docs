name: Deploy Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build documentation
        run: python build.py

      - name: Deploy to gh-pages
        run: |
          pip install ghp-import
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/gh-pages-out
          mkdir -p /tmp/gh-pages-out
          cp -a . /tmp/gh-pages-out/
          rm -rf /tmp/gh-pages-out/.git /tmp/gh-pages-out/.github /tmp/gh-pages-out/docs /tmp/gh-pages-out/build.py /tmp/gh-pages-out/.gitignore
          touch /tmp/gh-pages-out/.nojekyll
          ghp-import -n -p -f /tmp/gh-pages-out
